<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pacer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

               without this the page shows white for the first frames and then flashes to stock. */
            background: #efebe1;
        }
    </style>
    <script type="application/javascript" src="webApp.js"></script>
</head>
