<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Pacer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* RisoColors.paper. The canvas is transparent until Compose has laid the sheet down, so
               without this the page shows white for the first frames and then flashes to stock. */
            background: #efebe1;
        }
    </style>
    <script type="application/javascript" src="webApp.js"></script>
</head>

</html>
