# In the system folder picker, picks "Sample Book" from the sample library (scripts/sample-audio.sh).
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: android-open-audiobooks.yaml
      - tapOn: "Sample Book"
      - tapOn: "USE THIS FOLDER"
      - tapOn: "ALLOW"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow: ios-open-audiobooks.yaml
      - tapOn: "Sample Book, .*"
      - tapOn: "Open"
