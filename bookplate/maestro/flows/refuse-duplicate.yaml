# Adding a book that is already in the library is refused.
#
# Needs the sample library on the device: bookplate/scripts/sample-audio.sh android|ios.
#
# Scenario: same folder twice
#   Given "Sample Book" is in the library
#   When I add the "Sample Book" folder again
#   Then Home says it is already in the library, and still lists it once
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow: ../subflows/add-sample-folder.yaml
- extendedWaitUntil:
    visible: "Added “Sample Book”"
    timeout: 15000
- runFlow: ../subflows/add-sample-folder.yaml
- extendedWaitUntil:
    visible: "“Sample Book” is already in your library"
    timeout: 15000
- assertVisible:
    text: "Sample Book"
    index: 0
- assertNotVisible:
    text: "Sample Book"
    index: 1
