# Opening a book from the library.
#
# Needs the sample library on the device: bookplate/scripts/sample-audio.sh android|ios.
#
# Scenario: tap a book
#   Given "Sample Book" is in the library
#   When I tap its row
#   Then Player shows that book, paused at the start, and back returns to Home
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow: ../subflows/open-sample-book.yaml
- assertVisible: "Sample Book"
- assertVisible: "Sample Author"
- assertVisible: "Opening"
- assertVisible: "3:10"
- assertVisible: "Play"
- assertVisible: "Speed"
- assertVisible: "Rewind 10 seconds"
- assertVisible: "Forward 10 seconds"
- tapOn: "Back"
- assertVisible: "Search title or author"
- assertVisible: "Sample Book"
