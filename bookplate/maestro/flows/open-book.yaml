# Opening a book from the library.
#
# Needs the sample library on the device: bookplate/scripts/sample-audio.sh android|ios.
#
# Scenario: tap a book
#   Given "Sample Book" is in the library
#   When I tap its row
#   Then Player opens for that book, and back returns to Home
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow: ../subflows/add-sample-folder.yaml
- extendedWaitUntil:
    visible: "Added “Sample Book”"
    timeout: 15000
- tapOn: "Sample Book"
- assertVisible: "Player"
- assertVisible: "Book 1"
- tapOn: "Back"
- assertVisible: "Search title or author"
- assertVisible: "Sample Book"
